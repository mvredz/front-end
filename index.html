<!DOCTYPE html>  
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Meu Pet Virtual</title>

        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

        <style>

            .toggle-tema {
                cursor: pointer;
            }

            .estrelas {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 999;
                opacity: 0;
                transition: opacity 1s ease;
            }

            .estrelas.visivel {
                opacity: 1;
            }

            .estrela {
                position: absolute;
                width: 3px;
                height: 3px;
                background: white;
                border-radius: 50%;
                animation: piscar 2s infinite ease-in-out;
            }

            @keyframes piscar {
                0%, 100% { opacity: 0.2; transform: scale(1);   }
                50%       { opacity: 1;   transform: scale(1.4); }
            }

        </style>
    </head>

    <body style="background-image: url(bg.png);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;">

        <label class="toggle-tema swap swap-rotate fixed top-4 right-4 z-50">
            <input type="checkbox" id="tema" />

            <svg class="swap-off h-8 w-8 fill-current text-yellow-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7,5,6.36a1,1,0,0,0-1.41,1.41L4.22,8.46A1,1,0,0,0,5.64,7Zm12,.71.71-.71A1,1,0,0,0,16.93,5.64l-.71.71A1,1,0,0,0,17.66,7.66ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"/>
            </svg>

            <svg class="swap-on h-8 w-8 fill-current text-blue-200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z"/>
            </svg>
        </label>

        <div class="estrelas" id="estrelas"></div>

        <div class="avatar">
            <div class="ring-primary ring-offset-base-100 w-24 rounded-full ring-2 ring-offset-2">
                <img src="b_n.png" />
            </div>
        </div>

        <div class="flex flex-col items-center w-full px-4">
            <img id="b" src="b_n.png" alt="Imagem principal" class="w-full max-w-md h-auto"/>
            <div class="mt-12 flex justify-center w-full">
                <img id="btn" src="btn.png" alt="Botão" class="w-1/3 max-w-[180px] h-auto active:scale-95 transition" onclick="alimentar()"/>
            </div>

            <input type="text" placeholder="Nome" class="input input-secondary"/>
        </div> 

        <a href="ferlini.png" target="_blank" class="inline-block w-26">
            <img src="ferlini.png" alt="Abrir imagem" class="w-full opacity-10 hover:opacity-60 transition cursor-pointer"/>
        </a>

        <script src="script.js"></script>
    </body>
</html>
