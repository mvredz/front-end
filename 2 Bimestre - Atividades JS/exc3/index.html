<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Situação do Aluno</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 8px;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        #resultado {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }

        .aprovado {
            color: blue;
        }

        .exame {
            color: green;
        }

        .reprovado {
            color: red;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Situação Acadêmica</h2>

    <input type="text" id="nome" placeholder="Nome do aluno">

    <input type="number" id="nota1" placeholder="Nota 1">
    <input type="number" id="nota2" placeholder="Nota 2">
    <input type="number" id="nota3" placeholder="Nota 3">

    <button id="btnCalcular">Calcular Situação</button>

    <div id="resultado"></div>
</div>

<script>
    document.getElementById("btnCalcular").addEventListener("click", calcularSituacao);

    function calcularSituacao() {
        const nome = document.getElementById("nome").value;

        const n1 = Number(document.getElementById("nota1").value);
        const n2 = Number(document.getElementById("nota2").value);
        const n3 = Number(document.getElementById("nota3").value);

        const resultado = document.getElementById("resultado");

        const media = (n1 + n2 + n3) / 3;

        if (media >= 7 && media <= 10) {
            resultado.textContent = `${nome}, sua média é ${media.toFixed(2)}. Situação: APROVADO`;
            resultado.className = "aprovado";
        } 
        else if (media >= 4 && media < 7) {
            const falta = (10 - media).toFixed(2);
            resultado.textContent = `${nome}, sua média é ${media.toFixed(2)}. Situação: EXAME. Faltam ${falta} pontos para atingir 10.`;
            resultado.className = "exame";
        } 
        else {
            resultado.textContent = `${nome}, sua média é ${media.toFixed(2)}. Situação: REPROVADO`;
            resultado.className = "reprovado";
        }
    }
</script>

</body>
</html>
