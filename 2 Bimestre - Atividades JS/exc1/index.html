<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Validação de CPF</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #resultado {
            margin-top: 15px;
            font-weight: bold;
            font-size: 18px;
        }

        .valido {
            color: green;
        }

        .invalido {
            color: red;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Validar CPF</h2>

    <input type="text" id="cpf" placeholder="Digite o CPF (somente números)">
    <button onclick="validarCPF()">Validar</button>

    <div id="resultado"></div>
</div>

<script>
    function validarCPF() {
        let cpf = document.getElementById("cpf").value;
        let resultado = document.getElementById("resultado");

        // Remove caracteres não numéricos
        cpf = cpf.replace(/\D/g, '');

        // Verifica tamanho e CPFs inválidos conhecidos
        if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) {
            mostrarResultado(false);
            return;
        }

        // Validação do 1º dígito
        let soma = 0;
        for (let i = 0; i < 9; i++) {
            soma += parseInt(cpf.charAt(i)) * (10 - i);
        }
        let resto = (soma * 10) % 11;
        if (resto === 10) resto = 0;

        if (resto !== parseInt(cpf.charAt(9))) {
            mostrarResultado(false);
            return;
        }

        // Validação do 2º dígito
        soma = 0;
        for (let i = 0; i < 10; i++) {
            soma += parseInt(cpf.charAt(i)) * (11 - i);
        }
        resto = (soma * 10) % 11;
        if (resto === 10) resto = 0;

        if (resto !== parseInt(cpf.charAt(10))) {
            mostrarResultado(false);
            return;
        }

        mostrarResultado(true);
    }

    function mostrarResultado(valido) {
        let resultado = document.getElementById("resultado");

        if (valido) {
            resultado.textContent = "CPF Válido ✔";
            resultado.className = "valido";
        } else {
            resultado.textContent = "CPF Inválido ✖";
            resultado.className = "invalido";
        }
    }
</script>

</body>
</html>
