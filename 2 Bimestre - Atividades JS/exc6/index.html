<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Infinity Bank - Orçamento de Eventos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #fff;
            width: 380px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        select, input, button {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        button {
            margin-top: 15px;
            cursor: pointer;
        }

        .resultado {
            margin-top: 20px;
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }

        .resultado p {
            margin: 5px 0;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Orçamento de Evento</h2>

    <label>Pacote</label>
    <select id="pacote">
        <option value="">Selecione</option>
        <option value="standard">Standard</option>
        <option value="premium">Premium</option>
        <option value="deluxe">Infinity Deluxe</option>
    </select>

    <label>Quantidade de Pessoas</label>
    <input type="number" id="pessoas">

    <button id="btnCalcular">Calcular Orçamento</button>

    <div class="resultado" id="resultado"></div>
</div>

<script>
    document.getElementById("btnCalcular").addEventListener("click", calcularOrcamento);

    function calcularOrcamento() {
        const pacote = document.getElementById("pacote").value;
        const pessoas = Number(document.getElementById("pessoas").value);
        const resultado = document.getElementById("resultado");

        let valorPorPessoa = 0;

        switch (pacote) {
            case "standard":
                valorPorPessoa = 50;
                break;
            case "premium":
                valorPorPessoa = 80;
                break;
            case "deluxe":
                valorPorPessoa = 120;
                break;
            default:
                resultado.textContent = "Selecione um pacote válido.";
                return;
        }

        const custoBase = valorPorPessoa * pessoas;
        const taxaServico = custoBase * 0.10;
        const subtotal = custoBase + taxaServico;

        let desconto = 0;
        if (pessoas > 100) {
            desconto = subtotal * 0.05;
        }

        const totalFinal = subtotal - desconto;

        resultado.innerHTML = `
            <p>Custo Bruto: R$ ${custoBase.toFixed(2)}</p>
            <p>Taxa de Serviço (10%): R$ ${taxaServico.toFixed(2)}</p>
            <p>Desconto Fidelidade: R$ ${desconto.toFixed(2)}</p>
            <p><strong>Total Final: R$ ${totalFinal.toFixed(2)}</strong></p>
        `;
    }
</script>

</body>
</html>
